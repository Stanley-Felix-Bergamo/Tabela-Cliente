<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles/styles.css">
    <title>Projeto Tabela</title>
</head>

<body>
    <table class="tabela">
        <thead>
            <tr>
                <td>ID Pedido</td>
                <td>Cliente</td>
                <td>Status</td>
                <td>Valor</td>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>#1001</td>
                <td>Sofia Oliveira</td>
                <td><span class="status status-pago">Pago</span></td>
                <td>R$ 250,00</td>
            </tr>
            <tr>
                <td>#1002</td>
                <td>Miguel Tolitte</td>
                <td><span class="status status-pendente">Pendente</span></td>
                <td>R$ 120,50</td>
            </tr>
            <tr>
                <td>#1003</td>
                <td>Bruna Madeiros</td>
                <td><span class="status status-pago">Pago</span></td>
                <td>R$ 450,00</td>
            </tr>
            <tr>
                <td>#1004</td>
                <td>Mairon Men</td>
                <td><span class="status status-cancelado">Cancelado</span></td>
                <td>R$ 89,90</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td colspan="3"><strong>Total Acumulado</strong></td>
                <td><strong>R$ 910,40</strong></td>
            </tr>
        </tfoot>
    </table>
</body>

</html>
